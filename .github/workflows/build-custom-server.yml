name: Build custom Immich server

on:
  push:
    tags:
      - 'v*-tz-null-fix'

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/yrnyn/immich-server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          source_version="$(node -p "require('./server/package.json').version")"
          expected_tag="v${source_version}-tz-null-fix"

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag must be ${expected_tag}, received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "server_version=${source_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve floating major tag
        id: floating_tag
        shell: bash
        run: |
          IMAGE_TAG="${{ steps.release.outputs.image_tag }}"
          if [[ "$IMAGE_TAG" =~ ^(v[0-9]+)\.[0-9]+\.[0-9]+-tz-null-fix$ ]]; then
            MAJOR_TAG="${BASH_REMATCH[1]}"
            echo "major_tag=${MAJOR_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to derive a major tag from ${IMAGE_TAG}." >&2
            exit 1
          fi

      - name: Build and push custom immich-server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.floating_tag.outputs.major_tag }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
            IMMICH_SERVER_VERSION=${{ steps.release.outputs.server_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Immich $GITHUB_REF_NAME" --generate-notes
